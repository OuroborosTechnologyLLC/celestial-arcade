<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
        <script>
        tailwind.config = {
            darkMode: ['selector', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: {
                        background: 'hsl(var(--background))',
                        foreground: 'hsl(var(--foreground))',
                        card: 'hsl(var(--card))',
                        'card-foreground': 'hsl(var(--card-foreground))',
                        primary: 'hsl(var(--primary))',
                        'primary-foreground': 'hsl(var(--primary-foreground))',
                        secondary: 'hsl(var(--secondary))',
                        'secondary-foreground': 'hsl(var(--secondary-foreground))',
                        muted: 'hsl(var(--muted))',
                        'muted-foreground': 'hsl(var(--muted-foreground))',
                        accent: 'hsl(var(--accent))',
                        'accent-foreground': 'hsl(var(--accent-foreground))',
                        destructive: 'hsl(var(--destructive))',
                        'destructive-foreground': 'hsl(var(--destructive-foreground))',
                        border: 'hsl(var(--border))',
                        input: 'hsl(var(--input))',
                        ring: 'hsl(var(--ring))',
                    },
                    borderRadius: { DEFAULT: 'var(--radius)' }
                }
            }
        }
    </script>
    <style>
        :root { --background: 0 0% 100%; --foreground: 240 10% 3.9%; --card: 0 0% 100%; --card-foreground: 240 10% 3.9%; --popover: 0 0% 100%; --popover-foreground: 240 10% 3.9%; --primary: 240 5.9% 10%; --primary-foreground: 0 0% 98%; --secondary: 240 4.8% 95.9%; --secondary-foreground: 240 5.9% 10%; --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 46.1%; --accent: 240 4.8% 95.9%; --accent-foreground: 240 5.9% 10%; --destructive: 0 84.2% 60.2%; --destructive-foreground: 0 0% 98%; --border: 240 5.9% 90%; --input: 240 5.9% 90%; --ring: 240 10% 3.9%; --radius: 0.5rem; }
        [data-theme="dark"] { --background: 240 10% 3.9%; --foreground: 0 0% 98%; --card: 240 10% 3.9%; --card-foreground: 0 0% 98%; --popover: 240 10% 3.9%; --popover-foreground: 0 0% 98%; --primary: 0 0% 98%; --primary-foreground: 240 5.9% 10%; --secondary: 240 3.7% 15.9%; --secondary-foreground: 0 0% 98%; --muted: 240 3.7% 15.9%; --muted-foreground: 240 5% 64.9%; --accent: 240 3.7% 15.9%; --accent-foreground: 0 0% 98%; --destructive: 0 62.8% 30.6%; --destructive-foreground: 0 0% 98%; --border: 240 3.7% 15.9%; --input: 240 3.7% 15.9%; --ring: 240 4.9% 83.9%; }
        *, ::after, ::before { box-sizing: border-box; margin: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
        .tier-free { background: hsl(240 4.8% 85%); color: hsl(240 5.9% 20%); }
        .tier-basic { background: hsl(200 80% 85%); color: hsl(200 80% 30%); }
        .tier-premium { background: hsl(280 80% 85%); color: hsl(280 80% 30%); }
        [data-theme="dark"] .tier-free { background: hsl(240 4.8% 25%); color: hsl(240 5.9% 85%); }
        [data-theme="dark"] .tier-basic { background: hsl(200 80% 25%); color: hsl(200 80% 85%); }
        [data-theme="dark"] .tier-premium { background: hsl(280 80% 25%); color: hsl(280 80% 85%); }
        .status-active { background: hsl(120 60% 85%); color: hsl(120 60% 30%); }
        .status-cancelled { background: hsl(0 60% 85%); color: hsl(0 60% 30%); }
        .status-expired { background: hsl(var(--muted)); color: hsl(var(--muted-foreground)); }
        [data-theme="dark"] .status-active { background: hsl(120 60% 25%); color: hsl(120 60% 85%); }
        [data-theme="dark"] .status-cancelled { background: hsl(0 60% 25%); color: hsl(0 60% 85%); }
    </style>
    <script>(function() { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); })();</script>
</head>
<body class="bg-background text-foreground" x-data x-init="$store.app.init()">
    <!-- Navbar -->
    <nav class="border-b border-border bg-card py-3 md:py-4">
        <div class="mx-auto flex max-w-[1200px] items-center justify-between px-4 md:px-5">
            <div class="flex items-center gap-6">
                <a href="#/" class="text-lg font-semibold text-foreground no-underline md:text-2xl">Celestial Arcade</a>
                <div class="flex items-center gap-4">
                    <a href="#/games" class="text-sm font-medium text-foreground no-underline transition-colors hover:text-muted-foreground md:text-base">Games</a>
                    <a href="#/admin" class="text-sm font-medium text-foreground no-underline transition-colors hover:text-muted-foreground md:text-base" x-show="$store.app.isAdmin" x-cloak>Admin</a>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button @click="$store.app.toggleTheme()" class="inline-flex h-9 w-9 items-center justify-center rounded border border-border bg-transparent text-foreground transition-colors hover:bg-accent md:h-10 md:w-10" aria-label="Toggle theme">
                    <svg x-show="$store.app.theme === 'light'" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg x-show="$store.app.theme === 'dark'" x-cloak class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <template x-if="!$store.app.isAuthenticated">
                    <button @click="$store.app.openAuthModal('login')" class="inline-flex h-9 items-center justify-center rounded bg-primary px-3 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90 md:h-10 md:px-4">Log In</button>
                </template>
                <template x-if="$store.app.isAuthenticated">
                    <div class="relative" x-data="{ open: false }" @click.outside="open = false">
                        <button @click="open = !open" class="flex h-9 items-center gap-2 rounded border border-border bg-background px-3 text-sm text-foreground transition-colors hover:bg-accent md:h-10">
                            <span class="max-w-[120px] truncate" x-text="$store.app.userEmail"></span>
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div x-show="open" x-cloak class="absolute right-0 top-full z-50 mt-2 min-w-[150px] rounded border border-border bg-card shadow-lg">
                            <button @click="$store.app.logout(); open = false" class="block w-full px-4 py-2 text-left text-sm text-foreground transition-colors hover:bg-accent">Logout</button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="min-h-[calc(100vh-65px)]">
        <!-- Home Page -->
        <template x-if="$store.app.currentRoute === '/'">
            <div class="mx-auto max-w-[1000px] p-4 md:p-8">
                <div class="py-8 text-center md:py-12">
                    <h1 class="mb-4 text-3xl font-bold md:text-5xl">Welcome to Celestial Arcade</h1>
                    <p class="mb-6 text-muted-foreground">A simple authentication API prototype.</p>
                    <div class="flex flex-col justify-center gap-4 md:flex-row" x-show="!$store.app.isAuthenticated">
                        <button @click="$store.app.openAuthModal('login')" class="inline-flex h-11 items-center justify-center rounded bg-primary px-6 text-lg font-medium text-primary-foreground transition-colors hover:bg-primary/90 md:h-12 md:px-8">Log In</button>
                        <button @click="$store.app.openAuthModal('register')" class="inline-flex h-11 items-center justify-center rounded border border-border bg-secondary px-6 text-lg font-medium text-secondary-foreground transition-colors hover:bg-secondary/80 md:h-12 md:px-8">Sign Up</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Games Page -->
        <template x-if="$store.app.currentRoute === '/games'">
            <div x-data="gamesPage()" x-init="loadGames()" class="mx-auto max-w-[1200px] p-4 md:p-8">
                <div class="mb-6 flex flex-col gap-4 md:mb-8 md:flex-row md:items-center md:justify-between">
                    <h1 class="text-2xl font-bold md:text-3xl">Games Library</h1>
                    <div class="flex flex-wrap items-center gap-3">
                        <template x-if="$store.app.isAuthenticated">
                            <div class="flex flex-wrap items-center gap-3">
                                <span class="rounded px-2 py-1 text-sm font-semibold" :class="'tier-' + userTier" x-text="userTier.toUpperCase()"></span>
                                <span class="flex items-center gap-1 rounded bg-accent px-2 py-1 text-sm">💰 <span x-text="progression.coins"></span></span>
                                <span class="flex items-center gap-1 rounded bg-accent px-2 py-1 text-sm">⭐ <span x-text="progression.xp"></span> XP</span>
                                <span class="rounded bg-muted px-2 py-1 text-sm">💾 <span x-text="storageDisplay"></span></span>
                            </div>
                        </template>
                        <template x-if="!$store.app.isAuthenticated">
                            <div class="flex gap-2">
                                <button @click="$store.app.openAuthModal('login')" class="inline-flex h-9 items-center justify-center rounded bg-primary px-4 text-sm font-medium text-primary-foreground">Log In</button>
                                <button @click="$store.app.openAuthModal('register')" class="inline-flex h-9 items-center justify-center rounded border border-border bg-secondary px-4 text-sm font-medium text-secondary-foreground">Sign Up</button>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="grid gap-4 md:grid-cols-2 md:gap-6 lg:grid-cols-3">
                    <template x-if="loading">
                        <div class="col-span-full flex min-h-[300px] items-center justify-center"><p>Loading games...</p></div>
                    </template>
                    <template x-if="!loading && error">
                        <div class="col-span-full flex min-h-[300px] items-center justify-center"><p class="text-destructive" x-text="error"></p></div>
                    </template>
                    <template x-if="!loading && !error && games.length === 0">
                        <div class="col-span-full flex min-h-[300px] items-center justify-center"><p class="text-muted-foreground">No games available for your subscription tier.</p></div>
                    </template>
                    <template x-for="game in games" :key="game.slug">
                        <div class="overflow-hidden rounded border border-border bg-card transition-shadow hover:shadow-lg">
                            <div class="p-4 md:p-6">
                                <div class="mb-4 flex h-24 items-center justify-center rounded bg-accent md:h-[120px]"><span class="text-4xl font-bold text-muted-foreground md:text-5xl" x-text="game.name.charAt(0).toUpperCase()"></span></div>
                                <h3 class="mb-2 text-lg font-semibold md:text-xl" x-text="game.name"></h3>
                                <p class="mb-4 text-sm text-muted-foreground" x-text="game.description || 'No description available'"></p>
                                <div class="mb-3 flex flex-wrap gap-2 text-xs">
                                    <span class="rounded bg-muted px-2 py-1" x-text="'v' + game.version"></span>
                                    <span class="rounded bg-muted px-2 py-1" x-text="formatBytes(game.sizeBytes)"></span>
                                    <span class="rounded px-2 py-1 font-semibold" :class="'tier-' + game.tierRequired" x-text="game.tierRequired"></span>
                                </div>
                                <p class="mb-4 text-sm font-medium" :class="getCacheStatus(game.slug).cached ? 'text-green-600 dark:text-green-400' : getCacheStatus(game.slug).downloading ? 'text-yellow-600 dark:text-yellow-400' : 'text-muted-foreground'" x-text="getCacheStatus(game.slug).downloading ? 'Downloading...' : getCacheStatus(game.slug).cached ? '✓ Downloaded' : 'Not Downloaded'"></p>
                                <div class="flex gap-2">
                                    <button @click="playGame(game.slug)" :disabled="!canPlay(game.slug)" class="flex-1 inline-flex h-9 items-center justify-center rounded bg-primary text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90 disabled:opacity-50 md:h-10" x-text="canPlay(game.slug) ? 'Play' : 'Offline'"></button>
                                    <button @click="toggleCache(game.slug)" :disabled="getCacheStatus(game.slug).downloading" class="flex-1 inline-flex h-9 items-center justify-center rounded border border-border bg-secondary text-sm font-medium text-secondary-foreground transition-colors hover:bg-secondary/80 disabled:opacity-50 md:h-10" x-text="getCacheStatus(game.slug).downloading ? 'Downloading...' : getCacheStatus(game.slug).cached ? 'Delete' : 'Download'"></button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Game Player -->
        <template x-if="$store.app.currentRoute.startsWith('/play/')">
            <div x-data="gamePlayer()" x-init="init()" class="flex h-[calc(100vh-65px)] flex-col">
                <div class="flex items-center justify-between gap-4 border-b border-border bg-card px-4 py-3 md:px-8">
                    <button @click="window.location.hash = '/games'" class="inline-flex h-9 items-center justify-center rounded border border-border bg-secondary px-3 text-sm font-medium text-secondary-foreground transition-colors hover:bg-secondary/80">← Back</button>
                    <div class="flex flex-1 items-center justify-center gap-4">
                        <span class="text-lg font-semibold md:text-xl" x-text="gameName"></span>
                        <template x-if="$store.app.isAuthenticated">
                            <div class="flex items-center gap-2">
                                <span class="flex items-center gap-1 rounded bg-accent px-2 py-1 text-sm">💰 <span x-text="progression.coins"></span></span>
                                <span class="flex items-center gap-1 rounded bg-accent px-2 py-1 text-sm">⭐ <span x-text="progression.xp"></span> XP</span>
                            </div>
                        </template>
                    </div>
                    <button @click="toggleFullscreen()" class="inline-flex h-9 items-center justify-center rounded border border-border bg-secondary px-3 text-sm font-medium text-secondary-foreground transition-colors hover:bg-secondary/80">⛶ Fullscreen</button>
                </div>
                <div class="relative flex-1 overflow-hidden" id="frameContainer">
                    <iframe :src="'/games/' + gameSlug + '/index.html'" class="h-full w-full border-0" allowfullscreen></iframe>
                </div>
            </div>
        </template>

        <!-- Admin Page -->
        <template x-if="$store.app.currentRoute === '/admin'">
            <div x-data="adminPage()" x-init="init()" class="mx-auto max-w-[1200px] p-4 md:p-8">
                <h1 class="mb-4 text-2xl font-bold md:mb-6 md:text-3xl">Admin Dashboard</h1>
                <div class="mb-4 flex gap-0 border-b border-border md:mb-6">
                    <button @click="tab = 'games'; loadGames()" class="border-b-2 px-4 py-3 text-sm font-medium transition-colors md:px-5 md:text-base" :class="tab === 'games' ? 'border-primary text-foreground' : 'border-transparent text-muted-foreground hover:text-foreground'">Games</button>
                    <button @click="tab = 'subscriptions'; loadSubscriptions()" class="border-b-2 px-4 py-3 text-sm font-medium transition-colors md:px-5 md:text-base" :class="tab === 'subscriptions' ? 'border-primary text-foreground' : 'border-transparent text-muted-foreground hover:text-foreground'">Subscriptions</button>
                </div>
                <template x-if="!authorized">
                    <div class="flex min-h-[200px] items-center justify-center"><p class="text-muted-foreground">Access denied. Admin privileges required.</p></div>
                </template>
                <template x-if="authorized">
                    <div class="min-h-[300px]">
                        <!-- Games Tab -->
                        <template x-if="tab === 'games'">
                            <div>
                                <div class="mb-4 flex justify-end"><button @click="showGameModal()" class="inline-flex h-9 items-center justify-center rounded bg-primary px-4 text-sm font-medium text-primary-foreground md:h-10">Add Game</button></div>
                                <template x-if="loading"><div class="flex min-h-[200px] items-center justify-center"><p>Loading games...</p></div></template>
                                <template x-if="!loading">
                                    <div class="overflow-x-auto rounded border border-border">
                                        <table class="w-full">
                                            <thead class="bg-muted text-left text-xs font-semibold uppercase text-muted-foreground"><tr><th class="border-b border-border px-4 py-3">Name</th><th class="border-b border-border px-4 py-3">Slug</th><th class="border-b border-border px-4 py-3">Version</th><th class="border-b border-border px-4 py-3">Tier</th><th class="border-b border-border px-4 py-3">Size</th><th class="border-b border-border px-4 py-3">Actions</th></tr></thead>
                                            <tbody class="text-sm">
                                                <template x-if="games.length === 0"><tr><td colspan="6" class="px-4 py-6 text-center text-muted-foreground">No games found</td></tr></template>
                                                <template x-for="game in games" :key="game.slug">
                                                    <tr class="border-b border-border last:border-0">
                                                        <td class="px-4 py-3" x-text="game.name"></td>
                                                        <td class="px-4 py-3"><code class="rounded bg-muted px-1.5 py-0.5 text-xs" x-text="game.slug"></code></td>
                                                        <td class="px-4 py-3" x-text="game.version"></td>
                                                        <td class="px-4 py-3"><span class="rounded px-2 py-1 text-xs font-semibold" :class="'tier-' + game.tierRequired" x-text="game.tierRequired"></span></td>
                                                        <td class="px-4 py-3" x-text="formatBytes(game.sizeBytes)"></td>
                                                        <td class="px-4 py-3"><div class="flex gap-2"><button @click="showGameModal(game)" class="inline-flex h-8 items-center justify-center rounded border border-border bg-secondary px-3 text-xs font-medium text-secondary-foreground">Edit</button><button @click="deleteGame(game.slug)" class="inline-flex h-8 items-center justify-center rounded bg-destructive px-3 text-xs font-medium text-destructive-foreground">Delete</button></div></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <!-- Subscriptions Tab -->
                        <template x-if="tab === 'subscriptions'">
                            <div>
                                <div class="mb-4 flex justify-end"><button @click="showSubscriptionModal()" class="inline-flex h-9 items-center justify-center rounded bg-primary px-4 text-sm font-medium text-primary-foreground md:h-10">Add Subscription</button></div>
                                <template x-if="loading"><div class="flex min-h-[200px] items-center justify-center"><p>Loading subscriptions...</p></div></template>
                                <template x-if="!loading">
                                    <div class="overflow-x-auto rounded border border-border">
                                        <table class="w-full">
                                            <thead class="bg-muted text-left text-xs font-semibold uppercase text-muted-foreground"><tr><th class="border-b border-border px-4 py-3">User ID</th><th class="border-b border-border px-4 py-3">Tier</th><th class="border-b border-border px-4 py-3">Status</th><th class="border-b border-border px-4 py-3">Start Date</th><th class="border-b border-border px-4 py-3">End Date</th><th class="border-b border-border px-4 py-3">Actions</th></tr></thead>
                                            <tbody class="text-sm">
                                                <template x-if="subscriptions.length === 0"><tr><td colspan="6" class="px-4 py-6 text-center text-muted-foreground">No subscriptions found</td></tr></template>
                                                <template x-for="sub in subscriptions" :key="sub.id">
                                                    <tr class="border-b border-border last:border-0">
                                                        <td class="px-4 py-3"><code class="rounded bg-muted px-1.5 py-0.5 text-xs" x-text="sub.userId.substring(0, 8) + '...'"></code></td>
                                                        <td class="px-4 py-3"><span class="rounded px-2 py-1 text-xs font-semibold" :class="'tier-' + sub.tier" x-text="sub.tier"></span></td>
                                                        <td class="px-4 py-3"><span class="rounded px-2 py-1 text-xs font-semibold" :class="'status-' + sub.status" x-text="sub.status"></span></td>
                                                        <td class="px-4 py-3" x-text="formatDate(sub.startDate)"></td>
                                                        <td class="px-4 py-3" x-text="sub.endDate ? formatDate(sub.endDate) : '-'"></td>
                                                        <td class="px-4 py-3"><button @click="showSubscriptionModal(sub)" class="inline-flex h-8 items-center justify-center rounded border border-border bg-secondary px-3 text-xs font-medium text-secondary-foreground">Edit</button></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
                <!-- Admin Modal -->
                <div x-show="modalOpen" x-cloak @click.self="modalOpen = false" class="fixed inset-0 z-[1000] flex items-center justify-center bg-black/50 backdrop-blur-sm">
                    <div class="w-[90%] max-w-[500px] rounded border border-border bg-card p-6 md:p-8">
                        <div class="mb-6 flex items-center justify-between"><h3 class="text-lg font-semibold md:text-xl" x-text="modalTitle"></h3><button @click="modalOpen = false" class="text-2xl text-muted-foreground hover:text-foreground">&times;</button></div>
                        <div x-html="modalBody"></div>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- Auth Modal -->
    <div x-show="$store.app.authModalOpen" x-cloak @click.self="$store.app.closeAuthModal()" @keydown.escape.window="$store.app.closeAuthModal()" class="fixed inset-0 z-[1000] flex items-center justify-center bg-black/50 backdrop-blur-sm">
        <div x-data="authForm()" class="w-[90%] max-w-[400px] rounded border border-border bg-card p-6 md:p-8">
            <div class="mb-6 flex items-center justify-between">
                <h3 class="text-lg font-semibold md:text-xl" x-text="$store.app.authMode === 'login' ? 'Login' : 'Sign Up'"></h3>
                <button @click="$store.app.closeAuthModal()" class="text-2xl text-muted-foreground hover:text-foreground">&times;</button>
            </div>
            <form @submit.prevent="submit()">
                <div class="mb-4"><label class="mb-2 block text-sm font-medium">Email</label><input type="email" x-model="email" required class="w-full rounded border border-input bg-background px-3 py-2 text-sm transition-colors focus:border-ring focus:outline-none focus:ring-2 focus:ring-ring/10"></div>
                <div class="mb-4"><label class="mb-2 block text-sm font-medium">Password</label><input type="password" x-model="password" required class="w-full rounded border border-input bg-background px-3 py-2 text-sm transition-colors focus:border-ring focus:outline-none focus:ring-2 focus:ring-ring/10"></div>
                <div class="mb-4" x-show="$store.app.authMode === 'register'" x-cloak><label class="mb-2 block text-sm font-medium">Confirm Password</label><input type="password" x-model="confirmPassword" :required="$store.app.authMode === 'register'" class="w-full rounded border border-input bg-background px-3 py-2 text-sm transition-colors focus:border-ring focus:outline-none focus:ring-2 focus:ring-ring/10"></div>
                <div x-show="message" x-cloak class="mb-4 text-sm" :class="isError ? 'text-destructive' : 'text-primary'" x-text="message"></div>
                <button type="submit" :disabled="submitting" class="inline-flex h-10 w-full items-center justify-center rounded bg-primary text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90 disabled:opacity-50" x-text="submitting ? 'Please wait...' : ($store.app.authMode === 'login' ? 'Login' : 'Sign Up')"></button>
            </form>
            <div class="mt-4 text-center text-sm">
                <span x-text="$store.app.authMode === 'login' ? 'Don&#39;t have an account?' : 'Already have an account?'"></span>
                <button @click="$store.app.authMode = $store.app.authMode === 'login' ? 'register' : 'login'; message = ''" class="ml-1 text-primary underline" x-text="$store.app.authMode === 'login' ? 'Sign up' : 'Login'"></button>
            </div>
        </div>
    </div>

    <script type="module" src="/public/js/main.js"></script>
</body>
</html>
